[package]
name = "bikecontrol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "osmolcontrol"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
eframe.workspace = true
png = "0.18"
egui.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bike-core.workspace = true
bike-gearing.workspace = true
bike-protocol.workspace = true
bike-ble.workspace = true
bike-session.workspace = true

# Same winit and x11rb as eframe; X11 lets the overlay stay above fullscreen games.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
x11rb = "0.13"

[lints]
workspace = true
